<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090c12" media="(prefers-color-scheme: dark)">
  <title>CyberSecure – Stav aktualizací</title>

  <!-- Firebase Realtime Database SDK (Compat – funguje lokálně i na serveru) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-base: #eef2f8;
      --bg-orb-1: rgba(0, 122, 255, 0.2);
      --bg-orb-2: rgba(52, 199, 89, 0.22);
      --bg-orb-3: rgba(175, 82, 222, 0.14);

      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-bg-strong: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-border-subtle: rgba(15, 23, 42, 0.06);
      --glass-shadow: 0 14px 38px rgba(15, 23, 42, 0.07), 0 2px 8px rgba(15, 23, 42, 0.04);
      --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.92);

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #64748b;

      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-green-dark: #1ea844;
      --accent-green-soft: rgba(52, 199, 89, 0.14);
      --accent-green-glow: rgba(52, 199, 89, 0.36);
      --accent-red: #ff3b30;

      --divider: rgba(15, 23, 42, 0.09);

      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-pill: 999px;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #090c12;
        --bg-orb-1: rgba(10, 132, 255, 0.24);
        --bg-orb-2: rgba(48, 209, 88, 0.22);
        --bg-orb-3: rgba(191, 90, 242, 0.18);

        --glass-bg: rgba(28, 32, 42, 0.64);
        --glass-bg-strong: rgba(34, 39, 51, 0.82);
        --glass-border: rgba(255, 255, 255, 0.13);
        --glass-border-subtle: rgba(255, 255, 255, 0.07);
        --glass-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.3);
        --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.14);

        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-tertiary: #94a3b8;

        --accent-blue: #0a84ff;
        --accent-green: #30d158;
        --accent-green-soft: rgba(48, 209, 88, 0.16);
        --accent-red: #ff453a;

        --divider: rgba(255, 255, 255, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Ambient iOS 27 Background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(76px);
      will-change: transform;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 340px;
      height: 340px;
      background: var(--bg-orb-1);
      top: -90px;
      left: -80px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: var(--bg-orb-2);
      bottom: -80px;
      right: -90px;
      animation-delay: -6s;
      animation-duration: 22s;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: var(--bg-orb-3);
      top: 44%;
      left: 55%;
      animation-delay: -10s;
      animation-duration: 25s;
    }

    @keyframes orbFloat {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(24px, -20px, 0) scale(1.07); }
      100% { transform: translate3d(-18px, 24px, 0) scale(0.96); }
    }

    /* Shell */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      opacity: 0;
      transform: translateY(14px) scale(0.985);
      transition: opacity 0.45s var(--spring), transform 0.55s var(--spring);
    }

    .screen.active {
      display: flex;
    }

    .screen.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(185%);
      -webkit-backdrop-filter: blur(28px) saturate(185%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-shadow), var(--glass-inset);
    }

    /* ==================== LOADING SCREEN ==================== */
    #screen-loading {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .spinner-stage {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-halo {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(0, 122, 255, 0.5) 120deg,
        rgba(52, 199, 89, 0.5) 220deg,
        transparent 320deg
      );
      filter: blur(12px);
      opacity: 0.72;
      animation: spinLinear 2.2s linear infinite;
    }

    .spinner-orb {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-arc {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(
        from 0deg,
        rgba(0, 122, 255, 0) 0%,
        rgba(0, 122, 255, 0.14) 45%,
        var(--accent-blue) 78%,
        var(--accent-green) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      animation: spinLinear 1.2s linear infinite;
    }

    .ios-activity {
      position: relative;
      width: 34px;
      height: 34px;
    }

    .ios-activity span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 9px;
      margin-left: -1.5px;
      margin-top: -17px;
      border-radius: 4px;
      background: var(--text-primary);
      transform-origin: 50% 17px;
      animation: iosTickFade 1.08s linear infinite;
    }

    .ios-activity span:nth-child(1)  { transform: rotate(0deg);   animation-delay: -0.99s; }
    .ios-activity span:nth-child(2)  { transform: rotate(30deg);  animation-delay: -0.90s; }
    .ios-activity span:nth-child(3)  { transform: rotate(60deg);  animation-delay: -0.81s; }
    .ios-activity span:nth-child(4)  { transform: rotate(90deg);  animation-delay: -0.72s; }
    .ios-activity span:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.63s; }
    .ios-activity span:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.54s; }
    .ios-activity span:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.45s; }
    .ios-activity span:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.36s; }
    .ios-activity span:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.27s; }
    .ios-activity span:nth-child(10) { transform: rotate(270deg); animation-delay: -0.18s; }
    .ios-activity span:nth-child(11) { transform: rotate(300deg); animation-delay: -0.09s; }
    .ios-activity span:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }

    @keyframes spinLinear {
      to { transform: rotate(360deg); }
    }

    @keyframes iosTickFade {
      0% { opacity: 1; }
      100% { opacity: 0.16; }
    }

    .loading-title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .loading-sub {
      margin-top: 6px;
      font-size: 13.5px;
      color: var(--text-tertiary);
    }

    /* ==================== MAIN SCREEN ==================== */
    #screen-main {
      justify-content: center;
      padding: 8px 0;
    }

    .main-card {
      padding: 28px 20px 24px;
      border-radius: var(--radius-xl);
    }

    .status-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 6px;
    }

    .check-stage {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .check-glow {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-green-glow) 0%, transparent 72%);
      animation: breatheGlow 3.2s ease-in-out infinite;
    }

    @keyframes breatheGlow {
      0%, 100% { transform: scale(0.94); opacity: 0.72; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .check-badge {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3ee06d 0%, var(--accent-green) 55%, var(--accent-green-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 14px 28px rgba(52, 199, 89, 0.36),
        inset 0 2px 3px rgba(255, 255, 255, 0.52);
    }

    .check-path {
      stroke-dasharray: 42;
      stroke-dashoffset: 42;
      animation: drawCheck 0.65s var(--spring) 0.18s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .hero-title {
      font-size: clamp(24px, 6.4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
    }

    .hero-pill {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: var(--accent-green-soft);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent-green-dark);
    }

    @media (prefers-color-scheme: dark) {
      .hero-pill {
        color: var(--accent-green);
      }
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* Divider */
    .section-divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--divider) 14%, var(--divider) 86%, transparent 100%);
      margin: 22px 0 20px;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 14px;
      padding: 0 2px;
    }

    /* Updates List */
    .updates-list {
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      background: var(--glass-border-subtle);
      border: 1px solid var(--divider);
      overflow: hidden;
    }

    .update-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px;
      border-bottom: 1px solid var(--divider);
      transition: background-color 0.2s ease;
    }

    .update-row:last-child {
      border-bottom: none;
    }

    .update-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .row-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .row-icon.security {
      color: var(--accent-green);
    }

    .update-label {
      font-size: 13.8px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.32;
    }

    .update-value {
      flex-shrink: 0;
      font-size: 13.8px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      text-align: right;
      white-space: nowrap;
    }

    .level-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: var(--accent-green-soft);
      color: var(--accent-green-dark);
      font-weight: 700;
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      .level-pill {
        color: var(--accent-green);
      }
    }

    /* Error Box */
    .error-banner {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 16px;
      background: rgba(255, 59, 48, 0.12);
      border: 1px solid rgba(255, 59, 48, 0.28);
      color: var(--accent-red);
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
    }

    .error-banner.show {
      display: block;
    }

    @media (max-width: 390px) {
      .main-card {
        padding: 24px 15px 20px;
      }
      .update-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 13px 14px;
      }
      .update-value {
        padding-left: 43px;
        text-align: left;
      }
    }
  </style>
</head>

  </main>

      };

      const AUTO_X_KEYS = ['antimalwareDefinitions', 'antimalwareShields'];

      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      // Lokální klíč dne YYYY-MM-DD (vždy podle lokálního času zařízení, ne UTC)
      function getLocalDateKey(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      }

      // Český formát: den.měsíc.rok, hodina:minuta
      function formatCzechDateTime(date, hourOverride, minuteOverride) {
        const d = pad2(date.getDate());
        const m = pad2(date.getMonth() + 1);
        const y = date.getFullYear();
        const hh = pad2(hourOverride !== undefined ? hourOverride : date.getHours());
        const mm = pad2(minuteOverride !== undefined ? minuteOverride : date.getMinutes());
        return `${d}.${m}.${y}, ${hh}:${mm}`;
      }

      // Náhodný čas přísně v rozsahu 18:00 (1080 min) až 21:30 (1290 min) včetně
      function generateRandomEveningTime() {
        const MIN_MINUTES = 18 * 60;      // 18:00 = 1080
        const MAX_MINUTES = 21 * 60 + 30; // 21:30 = 1290
        const totalMins = MIN_MINUTES + Math.floor(Math.random() * (MAX_MINUTES - MIN_MINUTES + 1));
        const hour = Math.floor(totalMins / 60); // 18, 19, 20 nebo 21
        const minute = totalMins % 60;           // 0–59 (při hodině 21 max 30)
        return { hour, minute };
      }

      // Vytvoří záznam pro X položku pro konkrétní den
      function createEveningRecord(dateObj) {
        const { hour, minute } = generateRandomEveningTime();
        return {
          dateKey: getLocalDateKey(dateObj),
          display: formatCzechDateTime(dateObj, hour, minute)
        };
      }

      // Přesměrování při aktivním UpdateNow
      function checkRedirect(updateNowValue) {
        if (typeof updateNowValue === 'string') {
          const trimmed = updateNowValue.trim();
          if (trimmed && trimmed.toLowerCase() !== 'none') {
            window.location.replace(trimmed);
            return true;
          }
        }
        return false;
      }

      // Vykreslení hodnot do UI
      function renderUpdates(updatesData) {
        const u = updatesData || {};
        els.antimalwareDefinitions.textContent = (u.antimalwareDefinitions && u.antimalwareDefinitions.display) || '—';
        els.antimalwareShields.textContent = (u.antimalwareShields && u.antimalwareShields.display) || '—';
        els.appUpdate.textContent = (u.appUpdate && u.appUpdate.display) || '—';
        els.antimalwarePlatform.textContent = (u.antimalwarePlatform && u.antimalwarePlatform.display) || '—';
        els.securityPatchLevel.textContent = (u.securityPatchLevel !== undefined && u.securityPatchLevel !== null && u.securityPatchLevel !== '')
          ? String(u.securityPatchLevel)
          : '—';
      }

      function showMainScreen() {
        if (screenMain.classList.contains('active')) return;
        screenLoading.classList.remove('visible');
        window.setTimeout(() => {
          screenLoading.classList.remove('active');
          screenMain.classList.add('active');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              screenMain.classList.add('visible');
            });
          });
        }, 280);
      }

      async function init() {
        const startMs = Date.now();
        const MIN_LOADING_MS = 950;

        try {
          const rootRef = db.ref('/');
          const snapshot = await rootRef.once('value');
          const data = snapshot.val() || {};

          // 1) Kontrola UpdateNow -> okamžité přesměrování
          if (checkRedirect(data.UpdateNow)) {
            return;
          }

          const now = new Date();
          const todayKey = getLocalDateKey(now);
          const nowMinutes = now.getHours() * 60 + now.getMinutes();
          const isAfter2130 = nowMinutes >= (21 * 60 + 30); // 21:30 až 23:59

          const updates = data.updates ? { ...data.updates } : {};
          const patchPayload = {};

          // Inicializace prázdné databáze při úplně prvním spuštění
          if (data.UpdateNow === undefined || data.UpdateNow === null) {
            patchPayload['UpdateNow'] = 'none';
          }

          if (!updates.appUpdate || !updates.appUpdate.display) {
            const initApp = {
              dateKey: todayKey,
              display: formatCzechDateTime(now)
            };
            updates.appUpdate = initApp;
            patchPayload['updates/appUpdate'] = initApp;
          }

          if (!updates.antimalwarePlatform || !updates.antimalwarePlatform.display) {
            const initPlatform = {
              dateKey: todayKey,
              display: formatCzechDateTime(now)
            };
            updates.antimalwarePlatform = initPlatform;
            patchPayload['updates/antimalwarePlatform'] = initPlatform;
          }

          if (updates.securityPatchLevel === undefined || updates.securityPatchLevel === null || updates.securityPatchLevel === '') {
            updates.securityPatchLevel = '9';
            patchPayload['updates/securityPatchLevel'] = '9';
          }

          // 2) Specifické chování pro položky X
          for (const key of AUTO_X_KEYS) {
            const current = updates[key];

            if (!current || !current.display || !current.dateKey) {
              // Databáze je prázdná: po 21:30 rovnou dnešek, před 21:30 včerejšek (aby se v 21:30 spustila aktualizace)
              const targetDate = new Date(now);
              if (!isAfter2130) {
                targetDate.setDate(targetDate.getDate() - 1);
              }
              const freshRecord = createEveningRecord(targetDate);
              updates[key] = freshRecord;
              patchPayload[`updates/${key}`] = freshRecord;
            } else if (isAfter2130 && current.dateKey !== todayKey) {
              // Je 21:30–23:59 a v databázi ještě NENÍ dnešní datum -> vygenerovat a uložit
              const freshRecord = createEveningRecord(now);
              updates[key] = freshRecord;
              patchPayload[`updates/${key}`] = freshRecord;
            }
            // Pokud je před 21:30 NEBO už v DB dnešní datum je -> nic se nemění
          }

          if (Object.keys(patchPayload).length > 0) {
            await rootRef.update(patchPayload);
          }

          renderUpdates(updates);

          // Krátké minimální zobrazení vyhledávání pro plynulý efekt
          const elapsed = Date.now() - startMs;
          const remaining = Math.max(0, MIN_LOADING_MS - elapsed);

          window.setTimeout(() => {
            showMainScreen();

            // Živý posluchač – okamžitě reaguje na změny z admin.html
            db.ref('UpdateNow').on('value', (snap) => {
              checkRedirect(snap.val());
            });

            db.ref('updates').on('value', (snap) => {
              if (snap.exists()) {
                renderUpdates(snap.val());
              }
            });
          }, remaining);

        } catch (err) {
          console.error('Chyba komunikace s Firebase:', err);
          loadingError.textContent = 'Nepodařilo se připojit k databázi aktualizací. Zkontrolujte připojení k internetu nebo pravidla Firebase.';
          loadingError.classList.add('show');
        }
      }

      init();
    })();
  </script>
